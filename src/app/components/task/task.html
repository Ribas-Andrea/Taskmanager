<div class="border rounded p-4 mb-3 shadow flex justify-between items-center bg-white hover:bg-gray-50 transition">
  <div>
    <div class="flex items-center gap-3">
      @if(tache.status == 'todo') {
        <span class="text-xs px-2 py-1 rounded-full bg-yellow-100 text-yellow-800">À faire</span>
      } @else {
        <span class="text-xs px-2 py-1 rounded-full bg-green-100 text-green-800">Terminé</span>
      }
      <p class="text-lg font-semibold "> {{ tache.title}}</p>
    </div>
    <p class="text-sm text-gray-600 mt-1">{{tache.description}} </p>
  </div>
  <div class="flex gap-2">
    @if(tache.status == 'todo') {
      <button class="bg-green-500 text-white px-3 py-1 rounded" (click)="finishTask()">Terminer</button>
    }
    
    <a class="bg-yellow-500 text-white px-3 py-1 rounded" [routerLink]="['/task', tache.id]">Modifier</a>
    <button class="bg-red-500 text-white px-3 py-1 rounded" (click)="deleteTask()">Supprimer</button>
  </div>
</div>
